<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloading Opened</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico">
<link rel="preload" href="manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="done">
  <div class="card">
    <a href="./"><img src="logo.png" alt="Opened"></a>
    <h1>Almost there&hellip;</h1>
    <p class="lead">Your download of Opened is starting.</p>
    <ol class="steps">
      <li><span class="n">1</span>Download Opened</li>
      <li class="bar" aria-hidden="true"></li>
      <li><span class="n">2</span>Run OpenedSetup.exe</li>
      <li class="bar" aria-hidden="true"></li>
      <li><span class="n">3</span>Start browsing</li>
    </ol>
    <p class="note">If your download didn't start automatically, click <a id="dl" href="https://github.com/qayyumjelah/opened-browser/releases/latest/download/OpenedSetup.exe">here</a>.</p>
  </div>
</main>
<script>
  setTimeout(function () { location.href = document.getElementById("dl").href; }, 600);
</script>
</body>
</html>
